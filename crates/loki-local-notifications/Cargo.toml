[package]
name = "loki-local-notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Encrypted, deduplicated local notification intents for LokiAI Part One (LNOT-001)."

[dependencies]
loki-incidents = { path = "../loki-incidents" }
loki-storage = { path = "../loki-storage" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "=1.24.1", features = ["v4"] }

[dev-dependencies]
loki-connectors-sdk = { path = "../loki-connectors-sdk" }
tempfile = "=3.27.0"
