[package]
name = "loki-local-notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Encrypted, deduplicated local notification intents for LokiAI Part One (LNOT-001)."

[dependencies]
loki-incidents = { path = "../loki-incidents" }
loki-storage = { path = "../loki-storage" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "=1.24.1", features = ["v4"] }

[dev-dependencies]
loki-connectors-sdk = { path = "../loki-connectors-sdk" }
tempfile = "=3.27.0"

# Enables loki-storage's `test-support` feature (a disposable,
# non-production secure-memory arena bootstrap — DAT-002-MEM-CODE-001) for
# this crate's own `[dev-dependencies]`-gated build only, so tests that call
# `loki_storage::open_or_migrate_sqlcipher` (via `LocalNotificationStore::
# open`) can satisfy the new fail-closed `require_ready()` gate with a
# disposable test-only arena instead of a real accepted profile. Cargo's
# resolver-2 feature unification applies this feature to the regular
# `[dependencies] loki-storage` entry above only when building this crate's
# tests, never in a release build. Mirrors crates/loki-storage/Cargo.toml's
# own self-referential dev-dependency.
loki-storage = { path = "../loki-storage", features = ["test-support"] }
