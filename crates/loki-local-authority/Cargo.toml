[package]
name = "loki-local-authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows-bound local installation authority for LokiAI's local-only milestone (LOC-001)."

[dependencies]
# Reuses the accepted RUN-002 Windows SID resolver so authority and the named
# pipe DACL derive identity from the same OS token boundary. Internal path
# dependency; no new licence or upstream maintenance surface.
loki-ipc = { path = "../loki-ipc" }
loki-storage = { path = "../loki-storage" }

# Durable transactional session metadata. Exact version matches loki-storage;
# MIT licensed and already reviewed/pinned in this workspace.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

# Unpredictable stable installation/session/correlation identifiers. Exact
# version already present in loki-ipc and the workspace lockfile; MIT/Apache-2.0.
uuid = { version = "=1.24.1", features = ["v4"] }

[dev-dependencies]
# Panic-safe cleanup for restart/persistence tests; already reviewed in
# loki-storage and never shipped in the production binary.
tempfile = "=3.27.0"

# Enables loki-storage's `test-support` feature (a disposable,
# non-production secure-memory arena bootstrap — DAT-002-MEM-CODE-001) for
# this crate's own `[dev-dependencies]`-gated build only, so tests that call
# `loki_storage::open_or_migrate_sqlcipher` (via `LocalAuthority::open`) can
# satisfy the new fail-closed `require_ready()` gate with a disposable
# test-only arena instead of a real accepted profile. Cargo's resolver-2
# feature unification applies this feature to the regular
# `[dependencies] loki-storage` entry above only when building this crate's
# tests, never in a release build. Mirrors crates/loki-storage/Cargo.toml's
# own self-referential dev-dependency.
loki-storage = { path = "../loki-storage", features = ["test-support"] }
