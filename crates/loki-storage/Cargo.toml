# LokiAI Main v1.2 — loki-storage (DAT-001).
#
# Runtime-owned SQLCipher schema, versioned migrations, a repository pattern
# over device registry / job records / outbox-inbox, and integrity/backup
# primitives. DAT-002 adds Windows DPAPI key protection, safe plaintext
# migration, rotation, and encrypted backup to DAT-001's storage foundation.
#
# Dependency policy: every entry below is justified per AGENTS.md rule 11
# (why it's needed, license, maintenance state) rather than added for
# convenience. Docs/TECH_STACK.md §5.1 requires exact versions in production
# manifests, so direct dependencies are pinned with `=`; Cargo.lock is
# committed on top of that for full reproducibility — matching
# crates/loki-runtime/Cargo.toml's convention.
[package]
name = "loki-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "LokiAI Main v1.2 runtime-owned SQLite storage: schema, versioned migrations, repository pattern, outbox/inbox, and integrity/backup primitives (DAT-001)."

[features]
# Compiles a disposable, non-production secure-memory arena bootstrap
# (`crate::secure_memory::test_support`) into the public API surface so this
# crate's own separate-process integration test binaries (each an
# independent `cargo test` target under `tests/`) can exercise real
# SQLCipher opens without the production fail-closed no-embedded-profile
# path ever accepting a caller-supplied or guessed bound
# (DAT-002-MEM-CODE-001 acceptance criterion: "Connection/cache/arena/
# working-set values have no guessed production default"). Off by default;
# only enabled through the self-referential `[dev-dependencies]` entry
# below, which applies solely to this crate's own `tests/*.rs` binaries, not
# to any downstream consumer or release build.
test-support = []

[dependencies]
# SQLite driver — Docs/TECH_STACK.md's "Local data" row: "SQLCipher
# 4.16.x-compatible SQLite, runtime-owned." rusqlite is the de facto
# standard, actively maintained Rust SQLite binding (rusqlite-rs project,
# MIT license, regular releases). `bundled` statically compiles a specific,
# pinned SQLite version from source rather than depending on whatever (if
# any) sqlite3 happens to be present on a user's Windows machine — required
# for a reproducible production desktop build (Docs/TECH_STACK.md §5.1:
# "exact versions ... lockfiles are committed and immutable"). Confirmed to
# build in this environment (MSVC Build Tools + the bundled SQLite amalgam
# compile cleanly — see Docs/graph/handoffs/DAT-001-1.md for the actual
# `cargo build` transcript). `bundled-sqlcipher`/`sqlcipher` are confirmed
# real feature names on this exact pinned version
# (`cargo add rusqlite --dry-run --no-default-features --features
# bundled-sqlcipher` / `--features sqlcipher` both resolve real features,
# not typos) — that is DAT-002's expected swap path; see src/cipher.rs.
# `default-features = false` drops upstream's default `ffi-sqlite-wasm-rs`
# (a WASM SQLite backend irrelevant to this native desktop crate) and
# `cache`/`hashlink` (an optional statement-cache this node's bounded
# repository pattern does not use); SQLCipher is statically compiled with
# vendored OpenSSL, while `backup` supports the consistency-guaranteed backup
# API.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "backup"] }

# Structured diagnostics for migration/integrity/backup lifecycle events —
# Docs/TECH_STACK.md's "Async/diagnostics" row names `tracing` directly, and
# it is already the pinned choice in crates/loki-runtime/Cargo.toml (same
# exact version here so the workspace lockfile resolves one copy, not two
# versions of the same crate for no reason). License: MIT, tokio-rs project.
# This crate only emits events (`tracing::info!`/`warn!`); it never
# initializes a subscriber — that stays the binary's responsibility
# (crates/loki-runtime/src/logging.rs), matching tracing's own
# library/binary split.
tracing = "=0.1.44"

[target.'cfg(windows)'.dependencies]
# Microsoft-maintained Win32 bindings already used for DPAPI and BCrypt.
# ADR-0005 additionally requires the Memory, ProcessStatus,
# SystemInformation, and Threading feature modules for current-process-only
# working-set snapshot/restore, page-size discovery, VirtualAlloc/VirtualLock,
# and per-page QueryWorkingSetEx attestation. This only expands generated
# bindings from the same exact dependency; no new crate, service, privilege,
# host-wide policy, or plaintext secret path is introduced.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Creates auto-cleaned-up temporary files/directories for this crate's
# filesystem-backed tests (restart/corruption/backup/integrity all need a
# real file, not `:memory:`, to exercise "close and reopen" and "copy a
# file" behavior). License: MIT OR Apache-2.0; long-established Rust
# ecosystem crate (used by cargo itself). Justification beyond convenience:
# its `Drop`-based cleanup is panic-safe (a failing `assert!` mid-test still
# removes the temp dir/file), which a hand-rolled temp-path helper would
# have to reimplement correctly to match — effectively rebuilding this
# crate. Dev-only: never compiled into the shipped library.
tempfile = "=3.27.0"

# Self-referential dev-dependency with `test-support` enabled: Cargo builds
# separate `tests/*.rs` integration-test binaries against this crate as an
# ordinary external dependency, so `#[cfg(test)]`-only code inside the
# library is invisible to them. This is the standard, minimal-footprint way
# to make a library-internal test fixture (here: the disposable secure-arena
# bootstrap) reachable from those binaries without shipping it unconditionally.
loki-storage = { path = ".", features = ["test-support"] }
