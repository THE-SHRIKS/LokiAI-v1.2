[package]
name = "loki-approvals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local policy and digest-bound single-use approvals (APR-001)."

[dependencies]
loki-local-authority = { path = "../loki-local-authority" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
# Pure Rust SHA-256 for canonical request binding. RustCrypto, MIT/Apache-2.0,
# actively maintained; small and removable behind `request_digest`.
sha2 = "=0.10.9"
uuid = { version = "=1.24.1", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
