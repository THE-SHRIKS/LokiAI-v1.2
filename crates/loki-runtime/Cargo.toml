# LokiAI Main v1.2 — loki-runtime (RUN-001).
#
# Standalone process skeleton for the Rust runtime described in
# Docs/ARCHITECTURE.md §3.2: startup, structured JSON diagnostics, a health
# mechanism, and graceful shutdown, with module boundaries later nodes
# (RUN-002 IPC, DAT-001 storage, JOB-001 jobs, CON-001+ connectors) extend.
# See Docs/graph/tasks/RUN-001.md for exact scope/forbidden-scope.
#
# This is a library+binary crate by Cargo convention (src/lib.rs +
# src/main.rs, no explicit [lib]/[[bin]] tables needed): the library holds
# every testable module, main.rs is a thin process entry point, and
# tests/*.rs black-box-tests the compiled binary directly.
#
# Dependency policy: every entry below is justified per AGENTS.md rule 11
# (why it's needed, license, maintenance state) rather than added for
# convenience. Docs/TECH_STACK.md §5.1 requires exact versions in production
# manifests, so direct dependencies are pinned with `=`; Cargo.lock is
# committed on top of that for full reproducibility.
[package]
name = "loki-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "LokiAI Main v1.2 Rust runtime process (hardware/job/durable-execution authority boundary)."

[features]
# Exposes `ComposedHost::open_with_test_arena` (`src/host/compose.rs`) — a
# test-only alternate startup entrypoint that bootstraps
# `loki_storage::secure_memory::test_support`'s disposable, non-production
# arena instead of the real `SecureMemoryRuntime::bootstrap()` production
# entrypoint `open()` always uses. Off by default; only turned on by this
# crate's own self-referential `[dev-dependencies]` entry below, so this
# crate's separate-process `tests/*.rs` integration-test binaries (which
# cannot see `cfg(test)`-only items) can still reach it, mirroring
# `crates/loki-storage/Cargo.toml`'s own `test-support` feature exactly.
test-support = []

[dependencies]
# Async runtime — Docs/TECH_STACK.md's "Async/diagnostics" row names Tokio
# explicitly. License: MIT. Maintainer: the tokio-rs project (also publishes
# `tracing`/`tracing-subscriber` below); the de facto standard async runtime,
# under active release. Features are limited to what this node actually
# uses:
#   - rt-multi-thread: the executor. Multi-thread (not current-thread) now so
#     later nodes (e.g. RUN-002's IPC listener) can add concurrent I/O
#     without a runtime-flavor rewrite.
#   - macros: `tokio::select!`, used by the run/shutdown race in
#     `src/runtime.rs` and by `#[tokio::test]` in this crate's unit tests.
#     (`main` itself stays a plain sync `fn` — see `src/main.rs` — so a
#     malformed CLI argument is rejected before any async runtime exists.)
#   - signal: Windows console-control-handler support
#     (pulls `windows-sys/Win32_System_Console`) for Ctrl-C/Ctrl-Break/close/
#     shutdown/logoff — this *is* "a signal-handling crate appropriate for
#     Windows": Tokio's own `signal` feature already provides fully
#     async-integrated Windows console-control events, so a second crate
#     (e.g. `ctrlc`) would only duplicate it and would fail AGENTS.md rule 11
#     ("no dependency merely for convenience").
#   - time: `tokio::time::interval` (heartbeat) and `tokio::time::timeout`
#     (tests; bounds wait time so a broken test hangs loudly, not silently).
#   - sync: `tokio::sync::oneshot` — added by RUN-003 (`src/host/compose.rs`)
#     to signal the IPC accept loop to stop once the shutdown/heartbeat race
#     in `src/runtime.rs` ends. No new crate: already a transitive dependency
#     via `loki-ipc` below, this only enables the feature directly for
#     `loki-runtime`'s own use of it.
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }

# Structured, span-based diagnostics API — named directly in
# Docs/TECH_STACK.md's "Async/diagnostics" row. License: MIT, tokio-rs
# project.
tracing = "=0.1.44"

# Subscriber that turns `tracing` events into the JSON log lines Deliverable
# 3 requires. License: MIT, tokio-rs project. Features:
#   - json: structured JSON output (transitively brings in tracing-serde,
#     serde, and serde_json — see the dev-dependency note below).
#   - env-filter: RUST_LOG-configurable verbosity so operators can raise the
#     log level without a rebuild.
# The default `SystemTime` timer (UTC RFC 3339, no extra crate) is used as
# published, so the optional "time"/"chrono" formatting features are not
# enabled.
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }

# Generates the per-run correlation ID (Deliverable 3; AGENTS.md rule 5:
# "Use stable IDs ... and correlation IDs"). License: Apache-2.0 OR MIT,
# uuid-rs project — the canonical Rust UUID implementation. Only the "v4"
# feature (random UUIDs) is enabled. RUN-003 also reuses it for the interim
# IPC token generator (`src/host/token.rs`), matching `loki-ipc`'s own
# `AuthToken::generate()` approach rather than adding a second randomness
# source.
uuid = { version = "=1.24.1", features = ["v4"] }

# RUN-003: (de)serializes the desktop-discovery file (`src/host/discovery.rs`)
# and the IPC handshake types it references. License: MIT OR Apache-2.0,
# serde-rs project. Not a new crate to the dependency graph: already resolved
# transitively via `tracing-subscriber`'s "json" feature and via `loki-ipc`
# (below); this promotes it to a direct production dependency of this crate
# too, matching `loki-ipc/Cargo.toml`'s own justification for the same crate.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# RUN-003: `crates/loki-storage` (`DAT-001`) — the background host opens and
# migrates its own SQLite database on startup (`src/host/compose.rs`) so
# state survives a crash/restart, per `Docs/graph/tasks/RUN-003.md`
# Deliverable 2. Same workspace, path dependency, no version pin needed
# (`publish = false`).
loki-storage = { path = "../loki-storage" }

# Production application services composed by `src/services`. Each service
# already accepts an `Arc<loki_storage::Storage>`; the runtime supplies one
# migrated store to all of them instead of allowing per-service databases.
# These are workspace crates (`publish = false`), so no external license or
# maintenance dependency is introduced here.
loki-local-authority = { path = "../loki-local-authority" }
loki-agents = { path = "../loki-agents" }
loki-approvals = { path = "../loki-approvals" }
loki-agent-delivery = { path = "../loki-agent-delivery" }
loki-jobs = { path = "../loki-jobs" }

# Real consequential-mutation submission boundary (`P1-RUNTIME-SERVICE-READINESS-CORR`
# follow-up): `src/services/mutation.rs` calls the real, atomic
# `loki_acceptance_store::accept_mutation` coordinator against the same
# shared `Arc<Storage>` every other service uses, instead of the earlier
# fail-closed placeholder. `loki-mutation-contract` supplies the closed,
# already-hardened `MutationAcceptanceRequest`/`AcceptanceResult` types the
# port's public signature is expressed in. Both are workspace crates
# (`publish = false`), no external license/maintenance dependency introduced.
loki-acceptance-store = { path = "../loki-acceptance-store" }
loki-mutation-contract = { path = "../loki-mutation-contract" }

[target.'cfg(windows)'.dependencies]
# RUN-003: `crates/loki-ipc` (`RUN-002`) — the background host binds and
# serves the real named-pipe IPC listener (`src/host/compose.rs`), and the
# desktop-discovery mechanism (`src/host/discovery.rs`) performs a real
# handshake+`ping` to determine host status. Windows-only, matching
# `loki-ipc`'s own scope (its `src/lib.rs` hard-fails to compile on any other
# target) — gated the same way here so a non-Windows `cargo check -p
# loki-runtime` (in isolation, not `--workspace`) does not require it. Same
# workspace, path dependency, no version pin needed (`publish = false`).
loki-ipc = { path = "../loki-ipc" }

[dev-dependencies]
# Creates auto-cleaned-up temporary directories for `src/host/*` tests
# (discovery files, token files, and the DAT-001 database all need a real
# path, not just an in-memory fixture, to exercise "close and reopen after a
# simulated crash"). Same exact version already resolved in this workspace
# via `crates/loki-storage/Cargo.toml`'s dev-dependency — no new crate.
# License: MIT OR Apache-2.0.
tempfile = "=3.27.0"

# Enables `loki-storage`'s `test-support` feature (a disposable,
# non-production secure-memory arena bootstrap — DAT-002-MEM-CODE-001) for
# this crate's own `[dev-dependencies]`-gated build only, so
# `ComposedHost::open_with_test_arena` can reach
# `loki_storage::secure_memory::test_support::bootstrap_disposable_test_arena`.
# Cargo's resolver-2 feature unification applies this feature to the regular
# `[dependencies] loki-storage` entry above only when building this crate's
# tests, never in a release build. Mirrors every other consumer crate's
# identical dev-dependency entry (see `crates/loki-monitoring/Cargo.toml`
# for the same pattern).
loki-storage = { path = "../loki-storage", features = ["test-support"] }

# Self-referential dev-dependency with `test-support` enabled: Cargo builds
# `tests/host_lifecycle.rs` as a separate integration-test binary against
# this crate as an ordinary external dependency, so the `#[cfg(test)]`-only
# half of `open_with_test_arena`'s gate is invisible to it — only the
# `feature = "test-support"` half is reachable from outside the crate.
# Mirrors `crates/loki-storage/Cargo.toml`'s own self-referential
# dev-dependency exactly.
loki-runtime = { path = ".", features = ["test-support"] }
