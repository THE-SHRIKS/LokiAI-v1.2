# LokiAI Main v1.2 — loki-monitoring (MON-001).
#
# Bounded telemetry/log ingestion: quality/freshness tracking, a
# capacity-bounded ingest buffer with an explicit, tested drop policy,
# gap/loss detection, a backpressure-safe subscription bus for later
# consumers (MON-002, UI), and durable storage. See
# Docs/graph/tasks/MON-001.md for exact scope/forbidden-scope, and
# src/lib.rs's module doc for why persistence here is this crate's own
# self-contained SQLite store rather than code added inside
# crates/loki-storage.
#
# Dependency policy: every entry below is justified per AGENTS.md rule 11
# (why it's needed, license, maintenance state) rather than added for
# convenience. Docs/TECH_STACK.md §5.1 requires exact versions in production
# manifests, so direct dependencies are pinned with `=`; Cargo.lock is
# committed on top of that for full reproducibility — matching
# crates/loki-runtime/Cargo.toml and crates/loki-storage/Cargo.toml's
# convention.
[package]
name = "loki-monitoring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "LokiAI Main v1.2 telemetry/log ingestion: bounded buffering, freshness/quality tracking, gap detection, subscriptions, and durable storage (MON-001)."

[dependencies]
# The device-neutral connector contract this pipeline ingests from — this
# node's required reading names crates/loki-connectors-sdk/src/health.rs
# directly ("the health-check shape this pipeline likely ingests"). Reused
# here for DeviceId/CorrelationId (Docs/graph/tasks/MON-001.md's
# "device-neutral — no ESP32-specific assumptions") and ValidationError, so
# this crate does not invent a second, divergent copy of identifiers CON-001
# already validates. Path dependency: same workspace, same version.
loki-connectors-sdk = { path = "../loki-connectors-sdk" }

# DAT-002's single reviewed SQLCipher/DPAPI boundary. Monitoring keeps its
# bounded-context database, but must not duplicate key handling or issue an
# unkeyed SQLite open. Path dependency: same workspace/version/licence.
loki-storage = { path = "../loki-storage" }

# Bounded, non-blocking multi-consumer event fan-out for the subscription
# mechanism (Deliverable 3, "backpressure: a slow consumer does not crash or
# unboundedly memory-balloon the producer side") — `tokio::sync::broadcast`
# is a fixed-capacity ring buffer per receiver: `Sender::send` never blocks
# and never grows unboundedly, and a receiver that falls behind gets an
# explicit `Lagged(n)` error instead of silently missing data or stalling
# the producer. Already the pinned choice in crates/loki-runtime/Cargo.toml
# (same exact version here so the workspace lockfile resolves one copy).
# License: MIT, tokio-rs project. Features:
#   - sync: the broadcast channel itself.
#   - time: `tokio::time::timeout`, used by this crate's own backpressure
#     test to prove a slow consumer never blocks the producer (bounding a
#     test that would otherwise hang silently instead of failing loudly).
#   - macros, rt-multi-thread: `#[tokio::test]` or multi-thread execution
#     for that same test — this crate's production code itself is
#     synchronous (no internal executor dependency); only the test needs an
#     async context to `.await` a `Receiver::recv()`.
tokio = { version = "=1.53.1", features = ["sync", "time", "macros", "rt-multi-thread"] }

# Structured diagnostics for ingest/drop/gap/persistence events — already
# the pinned choice in crates/loki-runtime/Cargo.toml and
# crates/loki-storage/Cargo.toml (same exact version here so the workspace
# lockfile resolves one copy). License: MIT, tokio-rs project. This crate
# only emits events; it never initializes a subscriber.
tracing = "=0.1.44"

# SQLite driver for this crate's own durable telemetry/log store — same
# exact pinned version/feature set as crates/loki-storage/Cargo.toml (same
# rationale: `bundled` statically compiles a pinned SQLite rather than
# depending on whatever, if anything, is present on a user's machine;
# `Docs/graph/tasks/MON-001.md`'s ownership section forbids this crate from
# adding a repository directly inside crates/loki-storage/src, so this
# crate persists through its own connection instead — see src/store.rs's
# doc comment for the full reasoning). `backup` is not enabled: this crate
# has no backup primitive of its own (that stays DAT-001/loki-storage's
# concern for the database it owns).
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
# Creates auto-cleaned-up temporary files for this crate's restart test
# (open store at a real path, close, reopen, assert data survived — a
# `:memory:` database cannot exercise that). Same exact pinned version as
# crates/loki-storage/Cargo.toml. License: MIT OR Apache-2.0.
tempfile = "=3.27.0"
