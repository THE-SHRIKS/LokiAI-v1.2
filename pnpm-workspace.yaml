# LokiAI Main v1.2 — pnpm workspace membership (FND-002).
#
# The existing UI baseline stays at its current accepted path; FND-002 does not
# perform the ARCHITECTURE.md section 11 mechanical move into apps/desktop. That
# move is a distinct, later migration node so it is never mixed with a behavior
# change in the same commit.
#
# packages/* and services/* are declared now so CTR-001, MCP-001, and later nodes
# can add workspace members without editing this file again.
packages:
  - 'LokiAI Desktop UI'
  - 'packages/*'
  - 'services/*'

allowBuilds:
  esbuild: true

# TECH_STACK.md section 5, rule 3: preinstall/postinstall scripts are denied
# unless specifically reviewed and allowlisted.
#
# MCP-001: `esbuild` is a genuine direct dependency of
# services/mcp-server/scripts/build.ts (bundles the standalone MCP server,
# inlining @lokiai/contracts, so it ships as a self-contained launcher per
# TECH_STACK.md rather than depending on Electron's embedded Node). Its
# postinstall script downloads the correct platform-specific native binary
# from esbuild's own published release — the standard, well-known mechanism
# every esbuild consumer relies on, not arbitrary/attacker-controlled code.
# Reviewed and allowlisted here, same precedent as DSK-001's node-gyp entry
# below. Removal: delete this entry if the MCP server drops esbuild (e.g. a
# future node switches bundlers).
onlyBuiltDependencies:
  - esbuild

# DSK-001: @electron-forge/cli -> @electron-forge/core -> @electron/rebuild pins
# its own transitive "@electron/node-gyp" dependency to a raw git commit
# (github:electron/node-gyp#<sha>) instead of a registry release. pnpm's default
# blockExoticSubdeps supply-chain guard correctly refuses to install that. Rather
# than disabling the guard (which would weaken it for every future dependency,
# not just this one), this override forces resolution to the same package's
# official npm-registry-published build, keeping the guard intact. Electron
# Forge's rebuild step is inert for this project (no native Node addons are
# built or shipped by electron/main or electron/preload), so the exact
# node-gyp build used has no runtime effect here. Removal: delete this override
# if @electron/rebuild starts depending on a registry-published node-gyp release
# directly, or if Forge/rebuild is dropped as a dependency.
overrides:
  '@electron/node-gyp': 'npm:@electron/node-gyp@10.2.0-electron.2'
